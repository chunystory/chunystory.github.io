<!doctype html>
<!-- build.py 가 이 틀을 언어마다 제 주소에 굽는다 — / · /en/ · /ja/ · /es/. data-paged 는 i18n.js 에게
     「이 페이지는 언어마다 주소가 있다」고 알린다(기기 언어로 글을 바꿔 달지 않는다). -->
<html lang="{{LANG}}" data-paged>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i="meta.title"></title>
<meta name="description" data-i-content="meta.desc">
<meta name="keywords" data-i-content="meta.keywords">
<meta name="robots" content="index, follow, max-image-preview:large">
<link rel="canonical" href="{{URL}}">
{{HREFLANG}}
<meta name="theme-color" content="#F5F1EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16120F" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:locale" content="{{OG_LOCALE}}">
{{OG_LOCALE_ALT}}
<meta property="og:site_name" content="말온도 · Malondo">
<meta property="og:title" data-i-content="meta.title">
<meta property="og:description" data-i-content="meta.desc">
<meta property="og:url" content="{{URL}}">
<!-- 1200×630 한 장씩, 언어마다. 원본은 src/og.py 가 짓는다. -->
<meta property="og:image" content="https://chunystory.github.io/og/{{LANG}}.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" data-i-content="meta.og.alt">
<meta name="twitter:card" content="summary_large_image">
<!-- 검색 엔진이 읽는 이 페이지의 뜻(사이트 이름 · 앱 · 자주 묻는 것). build.py 가 이 페이지의 언어로 짓는다. -->
<script type="application/ld+json">{{JSON_LD}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 앱과 같은 고딕. 쓰는 글자만 받아오는 동적 서브셋이라 가볍다. 못 받으면 시스템 고딕으로 선다. 일본어는 Pretendard JP 가 받는다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-jp-dynamic-subset.min.css">
<!-- 부리체는 앱의 질문 한 줄과 「이런 순간」에만 쓴다. 마루 부리는 굵기당 3.2MB 라 웹에서는 고운 바탕으로 대신한다. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400&family=Shippori+Mincho:wght@400&family=Lora:ital,wght@0,400;1,400&display=swap">
<style>
  :root {
    color-scheme: light;
    --canvas: #F5F1EA; --surface: #FDFCFA; --sunken: #F0EBE2;
    --ink: #211E1B; --ink-2: #56504A; --ink-3: #6C655D;
    --line: #E6DFD4; --line-2: #877D71;
    --accent: #BE2D1A; --accent-soft: #F9EAE8;
    /* 온도 램프 — 그래픽용(r) 과 글자용(ri). lib/theme/malondo_palette.dart 와 같은 값 */
    --r1: #2B4669; --r2: #325D57; --r3: #6D6359; --r4: #976A23; --r5: #C76138; --r6: #D76656;
    --r1i: #2B4669; --r2i: #325D57; --r3i: #6D6359; --r4i: #895B13; --r5i: #AA451E; --r6i: #BE2D1A;
    /* 헤드라인 강조 — 스토어 스크린샷의 청록→금→살구 */
    --g1: #2F7A6E; --g2: #B5832C; --g3: #D3664F;
    --blob1: rgba(156,208,198,.55); --blob2: rgba(234,205,150,.55); --blob3: rgba(242,181,161,.6);
    --frame: #3A3532; --frame-edge: #6B645F; --frame-in: #0A0908;
    --shadow: rgba(58,34,24,.42);
    --sans: "Pretendard Variable", Pretendard, "Pretendard JP Variable", "Pretendard JP", -apple-system, BlinkMacSystemFont,
            "Apple SD Gothic Neo", "Hiragino Sans", "Noto Sans KR", "Noto Sans JP", "Malgun Gothic", sans-serif;
    --serif: "Gowun Batang", "Shippori Mincho", "Apple Myungjo", "Hiragino Mincho ProN", "Noto Serif KR", "Noto Serif JP", serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  :root[lang="en"], :root[lang="es"] { --serif: Lora, "Iowan Old Style", Georgia, "Times New Roman", serif; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --canvas: #16120F; --surface: #211D19; --sunken: #100D0B;
      --ink: #F0EAE3; --ink-2: #B8AFA5; --ink-3: #9E958A;
      --line: #3A342E; --line-2: #7E756A;
      --accent: #E8ACA4; --accent-soft: #40221E;
      --r1: #7496C3; --r2: #50AA9E; --r3: #AEA396; --r4: #CDA669; --r5: #DFA690; --r6: #E8ACA4;
      --r1i: #7496C3; --r2i: #50AA9E; --r3i: #AEA396; --r4i: #CDA669; --r5i: #DFA690; --r6i: #E8ACA4;
      --g1: #50AA9E; --g2: #CDA669; --g3: #E8ACA4;
      --blob1: rgba(80,170,158,.18); --blob2: rgba(205,166,105,.16); --blob3: rgba(232,172,164,.18);
      --frame: #2B2622; --frame-edge: #4A423C; --frame-in: #050404;
      --shadow: rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --canvas: #16120F; --surface: #211D19; --sunken: #100D0B;
    --ink: #F0EAE3; --ink-2: #B8AFA5; --ink-3: #9E958A;
    --line: #3A342E; --line-2: #7E756A;
    --accent: #E8ACA4; --accent-soft: #40221E;
    --r1: #7496C3; --r2: #50AA9E; --r3: #AEA396; --r4: #CDA669; --r5: #DFA690; --r6: #E8ACA4;
    --r1i: #7496C3; --r2i: #50AA9E; --r3i: #AEA396; --r4i: #CDA669; --r5i: #DFA690; --r6i: #E8ACA4;
    --g1: #50AA9E; --g2: #CDA669; --g3: #E8ACA4;
    --blob1: rgba(80,170,158,.18); --blob2: rgba(205,166,105,.16); --blob3: rgba(232,172,164,.18);
    --frame: #2B2622; --frame-edge: #4A423C; --frame-in: #050404;
    --shadow: rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--canvas); color: var(--ink);
    font: 16px/1.75 var(--sans); letter-spacing: -.01em;
    word-break: keep-all; -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  :root[lang="en"] body, :root[lang="es"] body { letter-spacing: 0; word-break: normal; overflow-wrap: anywhere; }
  :root[lang="ja"] body { word-break: normal; line-break: strict; overflow-wrap: anywhere; }
  .wrap { max-width: 44rem; margin: 0 auto; padding: 0 1.25rem; }
  .wide { max-width: 68rem; margin: 0 auto; padding: 0 1.25rem; }
  h1, h2, h3 { margin: 0; letter-spacing: -.025em; line-height: 1.25; text-wrap: balance; }
  p { margin: 0 0 1rem; color: var(--ink-2); }
  p:last-child { margin-bottom: 0; }
  strong, b { color: var(--ink); font-weight: 600; }
  a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .18em; }
  a:hover { text-decoration-thickness: 2px; }
  a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  sub, sup { font-size: .72em; line-height: 0; }
  small { font-size: .8125rem; }
  .grad { background: linear-gradient(90deg, var(--g1), var(--g2) 55%, var(--g3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .eyebrow { display: block; font-size: .8125rem; font-weight: 600; letter-spacing: .02em; color: var(--accent); margin: 0 0 .6rem; }
  h2 { font-size: clamp(1.6rem, 3.2vw, 2.1rem); font-weight: 700; margin: 0 0 1rem; }
  h3 { font-size: 1.0625rem; font-weight: 600; }
  .tv { font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ── 나타나기 ── */
  html.js [data-reveal] { opacity: 0; transform: translateY(18px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
  html.js [data-reveal].in { opacity: 1; transform: none; }
  html.js [data-reveal][data-delay="1"] { transition-delay: .08s; }
  html.js [data-reveal][data-delay="2"] { transition-delay: .16s; }
  html.js [data-reveal][data-delay="3"] { transition-delay: .24s; }

  /* ── 머리 ── */
  .bar { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); background: color-mix(in srgb, var(--canvas) 78%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); }
  .bar .wide { display: flex; align-items: center; gap: .75rem; height: 3.5rem; }
  .bar img { width: 30px; height: 30px; border-radius: 8px; }
  .bar b { font-size: 1.05rem; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
  .bar nav { margin-left: auto; display: flex; gap: 1.1rem; font-size: .875rem; }
  .bar nav a { color: var(--ink-2); text-decoration: none; white-space: nowrap; }
  .bar nav a:hover { color: var(--ink); }
  .prefs { display: flex; align-items: center; gap: .4rem; margin-left: .9rem; }
  .bar nav:empty + .prefs, .prefs:first-child { margin-left: auto; }
  .prefs select, .prefs button { appearance: none; -webkit-appearance: none; font: inherit; font-size: .8125rem; font-weight: 600; color: var(--ink); background: color-mix(in srgb, var(--surface) 70%, transparent); border: 1px solid var(--line-2); border-radius: 999px; height: 2rem; padding: 0 .75rem; cursor: pointer; letter-spacing: 0; }
  .prefs select { padding-right: 1.6rem; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 13px) 55%, calc(100% - 9px) 55%; background-size: 4px 4px; background-repeat: no-repeat; }
  .prefs button { min-width: 2.6rem; font-variant-numeric: tabular-nums; }
  .prefs button:hover, .prefs select:hover { border-color: var(--ink); }
  @media (max-width: 640px) { .bar nav { display: none; } .prefs { margin-left: auto; } }

  /* ── 영웅 ── */
  .hero { position: relative; overflow: hidden; padding: 4rem 0 3.5rem; }
  .blobs { position: absolute; inset: -20% -10%; pointer-events: none; filter: blur(60px); z-index: 0; }
  .blob { position: absolute; border-radius: 50%; will-change: transform; }
  .blob.a { width: 46vw; height: 30vw; left: -8%; top: 55%; background: var(--blob1); animation: drift 26s ease-in-out infinite alternate; }
  .blob.b { width: 40vw; height: 26vw; right: -6%; top: 6%; background: var(--blob2); animation: drift 31s ease-in-out infinite alternate-reverse; }
  .blob.c { width: 50vw; height: 30vw; right: 4%; bottom: -8%; background: var(--blob3); animation: drift 37s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(6vw, -4vw) scale(1.12); } }
  .hero .wide { position: relative; z-index: 1; display: grid; gap: 2.5rem; align-items: center; }
  @media (min-width: 880px) { .hero .wide { grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: 3rem; } .hero { padding: 5.5rem 0 5rem; } }
  .hero h1 { font-size: clamp(2.2rem, 5.2vw, 3.6rem); font-weight: 700; line-height: 1.18; }
  .hero .lede { margin: 1.4rem 0 0; font-size: 1.125rem; max-width: 36ch; }
  .facts { list-style: none; margin: 1.1rem 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: .25rem 0; font-size: .875rem; color: var(--ink-3); }
  .facts li + li::before { content: "·"; margin: 0 .6rem; color: var(--line-2); }
  .stores { list-style: none; margin: 1.6rem 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: .6rem; }
  .store { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 0 .5rem; padding: .6rem 1rem; border: 1px solid var(--line-2); border-radius: .75rem; color: var(--ink); font-size: .9375rem; text-decoration: none; background: color-mix(in srgb, var(--surface) 70%, transparent); max-width: 100%; }
  .store small { color: var(--ink-3); }
  .store.soon { color: var(--ink-2); }

  /* 다이얼 */
  .dial-wrap { display: grid; justify-items: center; gap: 1.1rem; }
  .dial { position: relative; width: min(320px, 78vw); aspect-ratio: 1; }
  .ring { position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 240deg, var(--r1) 0deg, var(--r2) 52.5deg, var(--r3) 112.5deg, var(--r4) 157.5deg, var(--r5) 202.5deg, var(--r6) 240deg, transparent 240deg 360deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 30px), #000 calc(100% - 29px)); mask: radial-gradient(farthest-side, transparent calc(100% - 30px), #000 calc(100% - 29px)); }
  .needle { position: absolute; inset: 0; transform: rotate(var(--a, 0deg)); transition: transform .9s cubic-bezier(.3,.8,.3,1); will-change: transform; }
  .needle i { position: absolute; left: 50%; top: 15px; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 4px var(--canvas), 0 6px 18px var(--shadow); }
  .dial-core { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .dial-core .num { font-size: clamp(2.6rem, 8vw, 3.6rem); font-weight: 800; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; color: var(--tone, var(--ink)); transition: color .6s; }
  .dial-core .num small { font-size: .42em; font-weight: 700; letter-spacing: 0; margin-left: .1em; }
  .dial-core .tone { margin-top: .5rem; font-size: 1rem; font-weight: 600; color: var(--tone, var(--ink)); transition: color .6s; }
  .dial-core .drift { margin-top: .2rem; font-size: .8125rem; color: var(--ink-3); min-height: 1.4em; max-width: 16ch; }
  .wave { display: flex; align-items: center; gap: 4px; height: 34px; }
  .wave i { width: 4px; border-radius: 3px; background: var(--r5); height: 30%; animation: wave 1.4s ease-in-out infinite; opacity: .85; }
  .wave i:nth-child(odd) { background: var(--r4); }
  .wave i:nth-child(3n) { background: var(--r6); }
  @keyframes wave { 0%, 100% { height: 22%; } 50% { height: var(--h, 80%); } }
  .dial-note { font-size: .8125rem; color: var(--ink-3); text-align: center; max-width: 32ch; }

  /* ── 이런 순간 ── */
  .moments { padding: 1.5rem 0 3.5rem; }
  .moments .wrap { text-align: center; }
  .moments ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .55rem; }
  .moments li { font-family: var(--serif); font-size: clamp(1.15rem, 2.4vw, 1.5rem); line-height: 1.6; color: var(--ink-2); letter-spacing: -.005em; }
  .moments li:nth-child(2) { color: color-mix(in srgb, var(--ink-2) 78%, var(--ink)); }
  .moments li:nth-child(3) { color: var(--ink); }
  .moments .tail { margin: 1.6rem auto 0; font-size: 1rem; color: var(--ink-3); max-width: 34ch; }
  .moments .tail b { color: var(--accent); font-weight: 600; }
  .moments .sep { display: block; width: 28px; height: 2px; border-radius: 1px; margin: 1.4rem auto 0; background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3)); }

  /* ── 화면 넘겨보기 ── */
  .shots { padding: 3.5rem 0 3rem; border-top: 1px solid var(--line); }
  .shots .head { text-align: center; max-width: 40rem; margin: 0 auto 1.5rem; padding: 0 1.25rem; }
  .track { display: flex; gap: clamp(1rem, 3vw, 2.25rem); overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; padding: 1rem calc(50% - min(300px, 78vw) / 2) 1.5rem; scrollbar-width: none; -webkit-overflow-scrolling: touch; cursor: grab; }
  .track::-webkit-scrollbar { display: none; }
  .track.dragging { cursor: grabbing; scroll-snap-type: none; scroll-behavior: auto; }
  .slide { flex: 0 0 min(300px, 78vw); scroll-snap-align: center; display: grid; gap: 1rem; text-align: center; transition: transform .5s cubic-bezier(.2,.7,.2,1), opacity .5s; transform: scale(.93); opacity: .55; }
  .slide.on { transform: none; opacity: 1; }
  /* 글은 span 하나에 담는다 — h3 를 그리드로 두고 글을 바로 넣으면 맨 글자가
     익명 칸이 되어 <br> 이 죽고 낱말 덩어리마다 줄이 바뀐다. */
  .slide h3 { font-size: 1.125rem; font-weight: 700; line-height: 1.3; min-height: 3.9em; display: grid; align-content: end; }
  .slide h3 > span { display: block; }
  .slide p { font-size: .875rem; color: var(--ink-3); margin: -.4rem 0 0; }
  .phone { position: relative; width: 100%; aspect-ratio: 1284 / 2778; border-radius: 14% / 6.5%; background: var(--frame-in); box-shadow: 0 0 0 3px var(--frame-in), 0 0 0 11px var(--frame), 0 0 0 12px var(--frame-edge), 0 28px 50px -18px var(--shadow); margin: 12px auto 24px; }
  .phone img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
  .phone::after { content: ""; position: absolute; left: 50%; top: 2.2%; width: 27%; height: 3.4%; margin-left: -13.5%; border-radius: 999px; background: #070606; }
  .ctl { display: flex; align-items: center; justify-content: center; gap: 1rem; margin-top: .25rem; }
  .ctl button { appearance: none; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); width: 40px; height: 40px; border-radius: 50%; font-size: 1.1rem; cursor: pointer; display: grid; place-items: center; }
  .ctl button:hover { border-color: var(--ink); }
  .dots { display: flex; gap: 7px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); opacity: .45; transition: all .3s; }
  .dots i.on { opacity: 1; background: var(--accent); width: 20px; border-radius: 4px; }

  /* ── 구획 ── */
  section.plain { padding: 3.5rem 0; border-top: 1px solid var(--line); }
  .q { display: block; margin: 0 0 1.25rem; font-family: var(--serif); font-size: clamp(1.4rem, 2.6vw, 1.7rem); line-height: 1.5; letter-spacing: -.01em; color: var(--ink); }
  .q::before, .q::after { content: none; }
  .does { list-style: none; margin: 1.75rem 0 0; padding: 0; display: grid; gap: 1rem; }
  .does li { padding: 1.25rem 1.25rem 1.35rem; border: 1px solid var(--line); border-radius: 1rem; background: var(--surface); font-size: .9375rem; color: var(--ink-2); }
  .does li i { display: block; width: 34px; height: 4px; border-radius: 2px; margin-bottom: 1rem; background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3)); }
  .does b { display: block; margin-bottom: .3rem; font-size: 1.0625rem; }
  @media (min-width: 720px) { .does { grid-template-columns: repeat(3, 1fr); gap: 1.25rem; } }

  /* ── 네 가지 언어 ── */
  .langs { padding: 3.5rem 0 3rem; border-top: 1px solid var(--line); position: relative; overflow: hidden; }
  .langs .blobs { opacity: .7; }
  .langs .wide { position: relative; z-index: 1; }
  .langs .head { text-align: center; max-width: 42rem; margin: 0 auto; }
  .fan { list-style: none; margin: 2.25rem auto 0; padding: 0 .5rem; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem 1.25rem; max-width: 30rem; }
  @media (min-width: 720px) { .fan { grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 60rem; gap: 1.5rem; } }
  /* 위를 맞춘다 — 아래를 맞추면 두 줄짜리 스페인어 자막 때문에 그 폰만 한 줄만큼
     위로 밀려 올라간다. 넷의 폰 높이는 같으므로 위를 맞추면 폰도 이름도 함께 선다.
     칸이 늘어나 도형이 눌리지 않게 안쪽도 위로 모은다. */
  .fan { align-items: start; }
  .fan li { display: grid; align-content: start; gap: .7rem; text-align: center; }
  .fan button { appearance: none; border: 0; padding: 0; background: none; cursor: pointer; display: grid; align-content: start; gap: .7rem; width: 100%; color: inherit; font: inherit; }
  .fan .phone { margin: 10px auto 18px; transform: translateY(0) scale(.94); opacity: .72; transition: transform .5s cubic-bezier(.2,.7,.2,1), opacity .5s; }
  .fan .phone::after { top: 2.2%; }
  .fan li.on .phone { transform: none; opacity: 1; }
  .fan button:hover .phone { opacity: 1; }
  .fan .name { font-weight: 700; font-size: 1rem; letter-spacing: 0; }

<script>

</script>
<script>
(function () {
  document.documentElement.classList.add('js');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var i18n = window.MalondoI18n;
  if (!i18n) return;

  // ── 다이얼 — 여섯 말투 사이를 오간다 ──
  var tonesC = [35.0, 35.7, 36.5, 37.1, 37.7, 38.2],
      toneKeys = ['tone.1', 'tone.2', 'tone.3', 'tone.4', 'tone.5', 'tone.6'],
      toneVars = ['r1i', 'r2i', 'r3i', 'r4i', 'r5i', 'r6i'];
  var needle = document.getElementById('needle'), num = document.getElementById('num'),
      toneEl = document.getElementById('tone'), driftEl = document.getElementById('drift'),
      dial = document.getElementById('dial');
  var lastT = 36.5;
  function nearest(v) { var b = 0; for (var i = 1; i < tonesC.length; i++) if (Math.abs(tonesC[i] - v) < Math.abs(tonesC[b] - v)) b = i; return b; }
  function show(v) {
    lastT = v;
    var a = -120 + 240 * (v - 35.0) / 3.2;
    needle.style.setProperty('--a', a.toFixed(2) + 'deg');
    num.innerHTML = i18n.fmtC(v) + '<small>' + i18n.sym() + '</small>';
    var n = nearest(v);
    toneEl.textContent = i18n.t(toneKeys[n]);
    dial.style.setProperty('--tone', 'var(--' + toneVars[n] + ')');
    var d = v - 36.5;
    driftEl.textContent = Math.abs(d) < 0.15
      ? i18n.t('dial.origin')
      : i18n.t(d > 0 ? 'dial.warmer' : 'dial.cooler').replace('{0}', i18n.fmtD(Math.abs(d)));
  }
  // 언어나 단위가 바뀌면 다이얼도 그 값으로 다시 선다.
  if (needle && num) { i18n.onChange(function () { show(lastT); }); show(36.5); }

  if (needle && num && !reduce) {
    var path = [36.5, 37.2, 37.8, 36.9, 36.1, 35.6, 36.4, 37.0, 38.0, 36.6];
    var i = 0, from = 36.5, to = 36.5, t0 = 0, dur = 2200, hold = 900, holding = true, hStart = performance.now();
    function ease(x) { return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; }
    function frame(now) {
      if (document.hidden) { requestAnimationFrame(frame); return; }
      if (holding) {
        if (now - hStart > hold) { holding = false; from = to; i = (i + 1) % path.length; to = path[i]; t0 = now; }
      } else {
        var k = Math.min(1, (now - t0) / dur);
        show(from + (to - from) * ease(k));
        if (k >= 1) { holding = true; hStart = now; }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  // ── 설명 영상 — 언어·단위마다 한 편을 고르고, 장면마다 아래 한 줄을 바꾼다 ──
  var film = document.getElementById('film');
  if (film) {
    var filmSrc = document.getElementById('filmSrc'), filmCap = document.getElementById('filmCap'),
        filmBtn = document.getElementById('filmToggle');
    // 장면이 바뀌는 자리(초). 영상을 구운 시간표와 같다.
    var cuts = [0, 4.8, 12.6, 17.4, 23.4, 29.6];
    var scene = -1, wantPlay = !reduce, filmSeen = false;
    film.muted = true;
    function sceneAt(t) { var k = 0; for (var j = 0; j < cuts.length; j++) if (t >= cuts[j] - 0.15) k = j; return k; }
    function caption(force) {
      var k = sceneAt(film.currentTime || 0);
      if (k === scene && !force) return;
      scene = k;
      filmCap.setAttribute('data-i', 'film.cap.' + (k + 1));
      filmCap.textContent = i18n.t('film.cap.' + (k + 1));
    }
    function label() {
      var key = film.paused ? 'film.play' : 'film.pause';
      filmBtn.setAttribute('data-i', key);
      filmBtn.textContent = i18n.t(key);
    }
    function pick() {
      var name = '/video/how-' + i18n.lang + '-' + i18n.unit;
      if (filmSrc.getAttribute('src') !== name + '.mp4') {
        var at = film.currentTime || 0, was = !film.paused;
        film.poster = name + '.webp';
        filmSrc.setAttribute('src', name + '.mp4');
        film.load();
        film.addEventListener('loadedmetadata', function once() {
          film.removeEventListener('loadedmetadata', once);
          try { film.currentTime = at; } catch (e) {}
          if (was) film.play().catch(function () {});
        });
      }
      caption(true);
      label();
    }
    film.addEventListener('timeupdate', function () { caption(false); });
    film.addEventListener('play', label);
    film.addEventListener('pause', label);
    filmBtn.addEventListener('click', function () {
      wantPlay = film.paused;
      if (film.paused) film.play().catch(function () {}); else film.pause();
    });
    i18n.onChange(pick);
    pick();
    // 보일 때만 돈다 — 화면 밖에서는 멈추고, 돌아오면 멈춘 자리에서 잇는다.
    new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        filmSeen = e.isIntersecting;
        if (filmSeen && wantPlay) film.play().catch(function () {});
        else if (!filmSeen && !film.paused) film.pause();
      });
    }, { threshold: 0.35 }).observe(film);
  }

  // ── 나타나기 ──
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.12 });
  var reveals = Array.prototype.slice.call(document.querySelectorAll('[data-reveal]'));
  reveals.forEach(function (el) {
    if (el.getBoundingClientRect().top < window.innerHeight * 0.95) el.classList.add('in');
    else io.observe(el);
  });
  setTimeout(function () { reveals.forEach(function (el) { if (el.getBoundingClientRect().top < window.innerHeight) el.classList.add('in'); }); }, 1500);

  // ── 온도 자 — 처음 보일 때 빛이 한 번 지나간다 ──
  var ramp = document.getElementById('ramp');
  if (ramp) {
    var ro = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { ramp.classList.add('wake'); ro.disconnect(); } });
    }, { threshold: 0.5 });
    ro.observe(ramp);
  }

  // ── 화면 넘겨보기 ──
  var track = document.getElementById('track');
  if (track) {
    var slides = Array.prototype.slice.call(track.querySelectorAll('.slide'));
    var dots = document.getElementById('dots');
    slides.forEach(function (_, k) { var d = document.createElement('i'); if (k === 0) d.className = 'on'; dots.appendChild(d); });
    var current = 0, userTouched = false, inView = false;
    function setActive(k) {
      current = k;
      slides.forEach(function (s, j) { s.classList.toggle('on', j === k); });
      Array.prototype.forEach.call(dots.children, function (d, j) { d.classList.toggle('on', j === k); });
    }
    var so = new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting && e.intersectionRatio >= 0.6) setActive(slides.indexOf(e.target)); });
    }, { root: track, threshold: [0.6] });
    slides.forEach(function (s) { so.observe(s); });
    function go(k) {
      k = (k + slides.length) % slides.length;
      var s = slides[k];
      track.scrollTo({ left: s.offsetLeft - (track.clientWidth - s.offsetWidth) / 2, behavior: reduce ? 'auto' : 'smooth' });
    }
    document.getElementById('prev').addEventListener('click', function () { userTouched = true; go(current - 1); });
    document.getElementById('next').addEventListener('click', function () { userTouched = true; go(current + 1); });
    track.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { userTouched = true; go(current + 1); e.preventDefault(); }
      if (e.key === 'ArrowLeft') { userTouched = true; go(current - 1); e.preventDefault(); }
    });
    ['touchstart', 'wheel', 'pointerdown'].forEach(function (ev) { track.addEventListener(ev, function () { userTouched = true; }, { passive: true }); });
    var dragging = false, sx = 0, sl = 0;
    track.addEventListener('pointerdown', function (e) {
      if (e.pointerType !== 'mouse') return;
      dragging = true; sx = e.clientX; sl = track.scrollLeft; track.classList.add('dragging'); track.setPointerCapture(e.pointerId);
    });
    track.addEventListener('pointermove', function (e) { if (dragging) track.scrollLeft = sl - (e.clientX - sx); });
    function endDrag() {
      if (!dragging) return; dragging = false; track.classList.remove('dragging');
      var best = 0, bd = Infinity, mid = track.scrollLeft + track.clientWidth / 2;
      slides.forEach(function (s, j) { var c = s.offsetLeft + s.offsetWidth / 2, d = Math.abs(c - mid); if (d < bd) { bd = d; best = j; } });
      go(best);
    }
    track.addEventListener('pointerup', endDrag); track.addEventListener('pointercancel', endDrag); track.addEventListener('pointerleave', endDrag);
    track.querySelectorAll('img').forEach(function (im) { im.draggable = false; });
    var vo = new IntersectionObserver(function (es) { es.forEach(function (e) { inView = e.isIntersecting; }); }, { threshold: 0.4 });
    vo.observe(track);
    if (!reduce) setInterval(function () { if (inView && !userTouched && !document.hidden) go(current + 1); }, 4200);
    requestAnimationFrame(function () { go(0); });
  }
})();
</script>
</body>
